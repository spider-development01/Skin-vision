<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        :root {
            --primary-orange: #e46c19;
            --dark-background: #0b0f1a;
            --text-light: #f0f0f0;
            --circle-circumference: 157;
            --check-length: 60;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-background);
            color: var(--text-light);
            line-height: 1.6;
        }

        .thank-you-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .message-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 40px 50px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(228, 108, 25, 0.2);
            opacity: 0;
            transform: scale(0.9);
            animation: fadeInScaleUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .message-box:hover {
            transform: scale(1.02) translateY(-5px);
            box-shadow: 0 10px 35px rgba(228, 108, 25, 0.4);
        }

        .message-box h1 {
            color: var(--primary-orange);
            font-size: 2.8em;
            margin-bottom: 15px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(-20px);
            animation: slideDown 0.6s ease-out 1.0s forwards;
        }

        .message-box p {
            font-size: 1.1em;
            margin-bottom: 10px;
            color: var(--text-light);
            opacity: 0;
            animation: fadeIn 0.6s ease-in 1.4s forwards;
        }

        .message-box .subtext {
            font-size: 0.95em;
            color: rgba(240, 240, 240, 0.8);
            margin-bottom: 0;
            opacity: 0;
            animation: fadeIn 0.6s ease-in 1.6s forwards;
        }

        .checkmark-svg-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px auto;
            display: block;
            transform: scale(0);
            animation: scaleUp 0.5s ease-out 0.4s forwards;
        }

        .checkmark-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .checkmark-circle {
            stroke-dasharray: var(--circle-circumference);
            stroke-dashoffset: var(--circle-circumference);
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: var(--primary-orange);
            fill: none;
            animation: strokeDraw 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: var(--check-length);
            stroke-dashoffset: var(--check-length);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-miterlimit: 10;
            stroke: var(--primary-orange);
            fill: none;
            animation: strokeDraw 0.4s cubic-bezier(0.65, 0, 0.45, 1) 1.0s forwards;
        }

        @keyframes fadeInScaleUp {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes scaleUp {
             to {
                transform: scale(1);
            }
        }

        @keyframes strokeDraw {
             to {
                stroke-dashoffset: 0;
            }
        }

    </style>
</head>
<body>
    <div class="thank-you-container">
        <div class="message-box">
            <div class="checkmark-svg-container">
                <svg class="checkmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                  <circle class="checkmark-circle" cx="26" cy="26" r="25" />
                  <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>

            <h1>Thank You!</h1>
            <p>Your query has been submitted successfully.</p>
            <p class="subtext">We aim to respond within 72 hours.</p>
        </div>
    </div>
</body>
</html>
